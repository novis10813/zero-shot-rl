[project]
name = "zero-shot-rl"
version = "0.1.0"
requires-python = "==3.9.*"
# Mirrors requirements.txt, except torch is bumped to a CUDA 12.8 build for Blackwell (sm_120) GPUs.
dependencies = [
    "chardet==4.0.0",
    "dm_control==1.0.12",
    "dm_env==1.6",
    "gymnasium==0.29.1",
    "google-cloud-storage==2.9.0",
    "loguru==0.7.0",
    "lxml==4.9.2",
    "matplotlib==3.7.1",
    "mujoco==2.3.5",
    "numpy==1.24.3",
    "h5py==3.11.0",
    "pandas==2.0.3",
    "POT==0.9.0",
    "protobuf==4.25.3",
    "PyYAML==6.0.1",
    "rliable==1.0.8",
    "scikit_learn==1.4.1.post1",
    "scipy==1.12.0",
    "tabulate==0.9.0",
    "torch==2.7.1",
    "tqdm==4.65.0",
    "wandb==0.15.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
