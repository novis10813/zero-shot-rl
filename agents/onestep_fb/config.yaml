# One-step FB (Zheng et al., arXiv:2602.11399), ported from
# github.com/chongyi-zheng/onestep-fb with the README's exorl-rnd-walker flags.

# training/eval
batch_size: 1024
discount: 0.98
eval_frequency: 20000  # how often to evaluate the agent in learning steps
eval_rollouts: 10  # how many rollouts to average over when evaluating
learning_steps: 1000000

# one-step FB
name: "onestep_fb"
z_dimension: 50

forward_hidden_dimension: 1024
forward_hidden_layers: 3
forward_layer_norm: true

backward_hidden_dimension: 256
backward_hidden_layers: 3
backward_layer_norm: true

actor_hidden_dimension: 1024
actor_hidden_layers: 3
actor_layer_norm: false
actor_final_init_scale: 0.01

learning_rate: 0.0001
tau: 0.01
orthonormalisation_coefficient: 0.1
z_mix_ratio: 0.5  # probability of a gaussian z instead of a B(s, a) z
bc_coefficient: 0.0
reward_temperature: 10.0  # softmax reward weighting in z inference
