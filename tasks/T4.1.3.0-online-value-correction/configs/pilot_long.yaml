# Pilot with 500 training episodes: Direct and Residual Q on walk in Actuator Strong of T3.2,
# FB seed 0, tested after 0, 1, 2, 5, 10, 20, 50, 100, 150, 200, 300, 400 and 500 episodes.
# Each job value is "<name> <value_correction args>".
on: idlab
vram: 4G
command: tasks/T4.1.3.0-online-value-correction/run.sh {seed} {job}
grid:
  seed: [0]
  job:
    - "pilot_long.direct --variants direct --tasks walk --episodes 500 --eval_at 0 1 2 5 10 20 50 100 150 200 300 400 500 --dynamics tasks/T3.2-ood-robustness/configs/actuator_strong.yaml"
    - "pilot_long.residual --variants residual --tasks walk --episodes 500 --eval_at 0 1 2 5 10 20 50 100 150 200 300 400 500 --dynamics tasks/T3.2-ood-robustness/configs/actuator_strong.yaml"
