# Direct and Residual Q on the four tasks in the stock Walker and in Friction Strong and
# Actuator Strong of T3.2, FB seed 0: 500 training episodes per task and variant, tested after
# 0, 50, 100, ... 500 episodes on 20 test episodes. Seeds 1 and 2 follow once seed 0 is read.
# Each job value is "<environment>.<variant> <value_correction args>".
on: idlab1
vram: 4G
command: tasks/T4.1.3.0-online-value-correction/run.sh {seed} {job} --episodes 500 --eval_every 50
grid:
  seed: [0]
  job:
    - "clean.direct --variants direct"
    - "clean.residual --variants residual"
    - "friction_strong.direct --variants direct --dynamics tasks/T3.2-ood-robustness/configs/friction_strong.yaml"
    - "friction_strong.residual --variants residual --dynamics tasks/T3.2-ood-robustness/configs/friction_strong.yaml"
    - "actuator_strong.direct --variants direct --dynamics tasks/T3.2-ood-robustness/configs/actuator_strong.yaml"
    - "actuator_strong.residual --variants residual --dynamics tasks/T3.2-ood-robustness/configs/actuator_strong.yaml"
