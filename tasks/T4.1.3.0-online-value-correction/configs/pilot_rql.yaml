# Pilot: residual soft Q-learning (zero_shot_rl.online.value_correction, Li et al. 2023) on walk in
# Actuator Mild and Strong of T3.2, FB seed 0, Q 64x2, alpha 0.1, omega 0.01, 0.03, 0.1, no radius.
# 100 training episodes, tested after 0, 10, ... 100 episodes on 5 test episodes.
# Each job value is "<name> <value_correction args>".
on: idlab1
vram: 4G
command: tasks/T4.1.3.0-online-value-correction/run.sh {seed} {job} --tasks walk --episodes 100 --eval_every 10 --eval_episodes 5 --hidden 64 --variants residual
grid:
  seed: [0]
  job:
    - "pilot_rql.mild_w0.01 --omega 0.01 --alpha 0.1 --dynamics tasks/T3.2-ood-robustness/configs/actuator_mild.yaml"
    - "pilot_rql.mild_w0.03 --omega 0.03 --alpha 0.1 --dynamics tasks/T3.2-ood-robustness/configs/actuator_mild.yaml"
    - "pilot_rql.mild_w0.1 --omega 0.1 --alpha 0.1 --dynamics tasks/T3.2-ood-robustness/configs/actuator_mild.yaml"
    - "pilot_rql.strong_w0.01 --omega 0.01 --alpha 0.1 --dynamics tasks/T3.2-ood-robustness/configs/actuator_strong.yaml"
    - "pilot_rql.strong_w0.03 --omega 0.03 --alpha 0.1 --dynamics tasks/T3.2-ood-robustness/configs/actuator_strong.yaml"
    - "pilot_rql.strong_w0.1 --omega 0.1 --alpha 0.1 --dynamics tasks/T3.2-ood-robustness/configs/actuator_strong.yaml"
