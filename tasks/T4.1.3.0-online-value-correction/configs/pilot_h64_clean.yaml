# Pilot: Residual Q (64x2) on walk in the stock Walker (clean), FB seed 0, 100 training episodes,
# tested after 0, 10, ... 100 episodes on 5 test episodes. radius 0.2 against unbounded.
# Each job value is "<name> <value_correction args>".
on: idlab
vram: 4G
command: tasks/T4.1.3.0-online-value-correction/run.sh {seed} {job} --tasks walk --episodes 100 --eval_every 10 --eval_episodes 5 --hidden 64 --variants residual
grid:
  seed: [0]
  job:
    - "pilot_h64_clean.r0.2 --radius 0.2"
    - "pilot_h64_clean.unbounded"
