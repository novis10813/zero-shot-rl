# lab sweep spec for the T04 training runs: FB, VC-FB, MC-FB and DVC-FB on walker rnd-100k, seeds 0-2.
# Paper hyperparameters (agents/*/config.yaml defaults, tau = 50, N = 3).
# Peak VRAM is about 8.4 GB per job, reached while loading the dataset after the job starts.
command: PYTHONUNBUFFERED=1 uv run python main_exorl.py {algo} walker rnd --eval_tasks stand walk run flip --wandb_logging False --dataset_path $HOME/zsrl-datasets/walker/rnd/dataset.npz --seed {seed}
vram: 10G
gpus: 1
grid:
  algo: [fb, vcfb, mcfb, dvcfb]
  seed: [0, 1, 2]
