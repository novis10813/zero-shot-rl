# Main comparison (paper section 5.1) and the beta / sigma grid of its appendix F.1, plus
# sigma = 0.01 of the authors' README: 10 runs x 10 episodes per task on the stock Walker.
# Each job value is "<name> <online_inference args>".
on: idlab
vram: 4G
command: tasks/T4.1-optimistic-task-inference/run_online.sh {seed} {job}
grid:
  seed: [0, 1, 2]
  job:
    - "base --methods oracle random"
    - "ucb --methods ucb:1 ucb:0.1 ucb:0.001"
    - "ts --methods ts:0.1 ts:0.01 ts:0.001 ts:0.0001"
