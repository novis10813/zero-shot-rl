# lab sweep spec: single-task CQL (agents/cql, upstream defaults) on walker rnd-100k,
# one policy per task, seeds 0-2. Upper-bound baseline for the T06 switching rules.
# Submitted with --sync (the DiCOS login node cannot clone the repo). Each job peaks at
# about 20 GB RAM while loading the dataset and trains at about 32 it/s on an A100
# (about 9 h for 1M steps).
on: dicos:a100-al9
gpus: 1
gpu_type: a100
time: 30h
cpus: 4
mem: 40G
command: PYTHONUNBUFFERED=1 uv run python main_exorl.py cql walker rnd --train_task {task} --eval_tasks {task} --wandb_logging False --dataset_path /ceph/work/IDLAB/$USER/zsrl-datasets/walker/rnd/dataset.npz --seed {seed}
grid:
  task: [stand, walk, run, flip]
  seed: [0, 1, 2]
