# Pure-PyTorch sep-CMA-ES in 4-sensor ANFIS parameter space (800k env steps).
# Uses diagonal covariance (sep-CMA-ES) to keep sample complexity linear in ANFIS parameter count (~200D).

algo: cmaes
param: anfis
zero_shot_init: true

anfis_config: ../../../configs/anfis/walker.yaml

budget:
  max_env_steps: 800000
  eval_every_env_steps: 40000

reference:
  dataset_transitions: 100000
  z_inference_steps: 10000
  seed: 42
  discount: 0.98

warmstart:
  enabled: true
  steps: 500
  lr: 0.01
  weight_decay: 0.0

cmaes:
  pop_size: 16                 # 50 generations over 800k steps (full episodes)
  init_sigma: 0.5              # tuned via T6.2 sigma probe (0.1 / 0.3 / 0.5)
  min_sigma: 0.0001
  max_sigma: 2.0
  diagonal: true               # sep-CMA-ES for ~200D ANFIS space
  param_scope: all             # all | consequent
  train_episodes_per_z: 1
  episode_steps: null
  horizon: null                # null -> full episode (1000 steps); set e.g. 100 for lookahead
  num_start_states: 2
  init_state_prob: 0.2
  bootstrap: true
  fb_q_head: min
  discount: 0.98
  buffer_size: 100000
  train_seed_offset: 100000
  seed: 1000

eval:
  tasks: null                  # resolves to [stand, walk, run, flip] for walker
  eval_episodes: 20            # 20 shared eval envs (seeds 5..24)
  eval_seed_start: 5
