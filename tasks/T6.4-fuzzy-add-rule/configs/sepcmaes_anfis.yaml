# Pure-PyTorch sep-CMA-ES in additive-rule ANFIS parameter space (800k env steps).
# Matches T6.2 cmaes_anfis.yaml hyperparameters exactly; pass --anfis_config to select sensor/consequent set.

algo: cmaes
param: anfis
zero_shot_init: true

anfis_config: walker_all37_additive_first.yaml

budget:
  max_env_steps: 800000
  eval_every_env_steps: 40000

reference:
  dataset_transitions: 100000
  z_inference_steps: 10000
  seed: 42
  discount: 0.98

warmstart:
  enabled: true
  steps: 500
  lr: 0.01
  weight_decay: 0.0

cmaes:
  pop_size: 16
  init_sigma: 0.5
  min_sigma: 0.0001
  max_sigma: 2.0
  diagonal: true
  param_scope: all
  train_episodes_per_z: 1
  episode_steps: null
  horizon: null
  num_start_states: 2
  init_state_prob: 0.2
  bootstrap: true
  fb_q_head: min
  discount: 0.98
  buffer_size: 100000
  train_seed_offset: 100000
  seed: 1000

eval:
  tasks: null
  eval_episodes: 20
  eval_seed_start: 5
