# All 37 Walker sensors, additive rules (74 rules), unnormalised firing, first_order (2812 cols).
anfis:
  domain: walker
  normalize_inputs: true
  temperature: null          # null -> 1.0 in additive mode
  rule_mode: additive
  normalize_firing: false
  max_rules: 256

  default_membership:
    type: gaussian
    min_sigma: 0.001
    init_sigma: 1.0

  sensors:
    torso_height: { enabled: true, num_terms: 2 }
    torso_upright: { enabled: true, num_terms: 2 }
    horizontal_velocity: { enabled: true, num_terms: 2 }
    angmomentum: { enabled: true, num_terms: 2 }
    com_vz: { enabled: true, num_terms: 2 }
    qvel_rootz: { enabled: true, num_terms: 2 }
    qvel_rootx: { enabled: true, num_terms: 2 }
    qvel_rooty: { enabled: true, num_terms: 2 }
    qvel_right_hip: { enabled: true, num_terms: 2 }
    qvel_right_knee: { enabled: true, num_terms: 2 }
    qvel_right_ankle: { enabled: true, num_terms: 2 }
    qvel_left_hip: { enabled: true, num_terms: 2 }
    qvel_left_knee: { enabled: true, num_terms: 2 }
    qvel_left_ankle: { enabled: true, num_terms: 2 }
    qpos_rootz: { enabled: true, num_terms: 2 }
    qpos_rootx: { enabled: true, num_terms: 2 }
    qpos_rooty: { enabled: true, num_terms: 2 }
    qpos_right_hip: { enabled: true, num_terms: 2 }
    qpos_right_knee: { enabled: true, num_terms: 2 }
    qpos_right_ankle: { enabled: true, num_terms: 2 }
    qpos_left_hip: { enabled: true, num_terms: 2 }
    qpos_left_knee: { enabled: true, num_terms: 2 }
    qpos_left_ankle: { enabled: true, num_terms: 2 }
    orient_torso_xx: { enabled: true, num_terms: 2 }
    orient_torso_xz: { enabled: true, num_terms: 2 }
    orient_right_thigh_xx: { enabled: true, num_terms: 2 }
    orient_right_thigh_xz: { enabled: true, num_terms: 2 }
    orient_right_leg_xx: { enabled: true, num_terms: 2 }
    orient_right_leg_xz: { enabled: true, num_terms: 2 }
    orient_right_foot_xx: { enabled: true, num_terms: 2 }
    orient_right_foot_xz: { enabled: true, num_terms: 2 }
    orient_left_thigh_xx: { enabled: true, num_terms: 2 }
    orient_left_thigh_xz: { enabled: true, num_terms: 2 }
    orient_left_leg_xx: { enabled: true, num_terms: 2 }
    orient_left_leg_xz: { enabled: true, num_terms: 2 }
    orient_left_foot_xx: { enabled: true, num_terms: 2 }
    orient_left_foot_xz: { enabled: true, num_terms: 2 }

  consequent:
    type: first_order

  output_activation: identity
  init_from_data: true
