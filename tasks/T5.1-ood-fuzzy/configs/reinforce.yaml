# Experiment / finetuning / evaluation protocol for T5.1-ood-fuzzy.
# Evaluates on the 20 shared eval environments (seeds 5..24) while finetuning
# ANFIS-z on disjoint finetune environment seeds (--seed / --train_seed_offset).

anfis_config: ../../../configs/anfis/walker.yaml

reference:
  dataset_transitions: 100000
  z_inference_steps: 10000
  seed: 42
  discount: 0.98

warmstart:
  enabled: true
  steps: 500
  lr: 0.01
  weight_decay: 0.0

reinforce:
  iters: 50
  pop_size: 16               # K sampled z per step (paired +eps / -eps)
  antithetic: true
  sigma: 0.5
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  train_episodes_per_z: 1
  train_seed_offset: 100000  # disjoint from eval seeds (5..24); override per ft_seed
  seed: 1000

eval:
  tasks: null                # resolves to [stand, walk, run, flip] for walker
  eval_every: 10             # writes step 0, 10, 20, ..., 50 to table6.csv
  eval_episodes: 20          # 20 shared eval envs (seeds 5..24)
  eval_seed_start: 5
