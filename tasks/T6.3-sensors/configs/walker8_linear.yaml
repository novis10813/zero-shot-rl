# The 8 sensors of tasks/T6.1-ood-fuzzy/configs/walker_actuator.yaml with one linguistic term each: a single
# rule, so the first_order ANFIS reduces to a linear reward r(s) = W x(s) + b over the z-scored sensors (9 parameters).

anfis:
  domain: walker
  normalize_inputs: true
  temperature: null
  t_norm: product
  normalize_firing: true
  max_rules: 1

  default_membership:
    type: gaussian
    min_sigma: 0.001
    init_sigma: 1.0

  sensors:
    torso_height:        { enabled: true, num_terms: 1, membership: { type: gaussian } }
    torso_upright:       { enabled: true, num_terms: 1, membership: { type: gaussian } }
    horizontal_velocity: { enabled: true, num_terms: 1, membership: { type: gaussian } }
    angmomentum:         { enabled: true, num_terms: 1, membership: { type: gaussian } }
    qvel_right_hip:      { enabled: true, num_terms: 1, membership: { type: gaussian } }
    qvel_left_hip:       { enabled: true, num_terms: 1, membership: { type: gaussian } }
    qvel_right_knee:     { enabled: true, num_terms: 1, membership: { type: gaussian } }
    qvel_left_knee:      { enabled: true, num_terms: 1, membership: { type: gaussian } }

  consequent:
    type: first_order

  output_activation: identity
  init_from_data: true
