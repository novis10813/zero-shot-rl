# sep-CMA-ES on direct z: high mild friction and actuator shifts (T4.1.2 configs) x 3 finetune seeds, CPU only, one thread per job.
on: idlab1
gpus: 0
command: OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONPATH=. MUJOCO_GL=disabled uv run python -m zero_shot_rl.finetune.anfis_z --config tasks/T6.3-sensors/configs/sepcmaes_z.yaml --device cpu --checkpoint /home/sam/zsrl-artifacts/T4.1.3.1-residual-soft-q/zero-shot-rl-297/660000.pt --dataset_path /home/sam/zsrl-datasets/walker/rnd/dataset.npz --dynamics tasks/T4.1.2-dynamic-shift-detection/configs/{env}.yaml --seed {ft_seed} --train_seed_offset {ft_seed}00 --out_dir out/sepcmaes_z_{env}_ft{ft_seed}
grid:
  env: [friction_high_mild, actuator_high_mild]
  ft_seed: [1000, 1010, 1020]
