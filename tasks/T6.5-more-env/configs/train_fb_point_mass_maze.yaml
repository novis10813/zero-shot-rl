# lab sweep spec for vanilla FB on ExORL point_mass_maze rnd-100k, seeds 0-4.
# Mirrors T4.1.3.1 Walker FB pretraining: 1M learning steps, eval every 20k steps saving every eval checkpoint.
on: idlab1
gpu_indices: [0]
vram: 12G
command: PYTHONUNBUFFERED=1 MUJOCO_GL=egl uv run python -m zero_shot_rl.train.main_exorl fb point_mass_maze rnd --eval_tasks reach_top_left reach_top_right reach_bottom_left reach_bottom_right --wandb_logging False --dataset_path $HOME/zsrl-datasets/point_mass_maze/rnd/dataset.npz --seed {seed}
grid:
  seed: [0, 1, 2, 3, 4]
