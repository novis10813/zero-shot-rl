# Unnormalised ANFIS firing ablation for T6-anfis.
# Reuses the global Walker ANFIS sensor config and overrides only `anfis.normalize_firing: false`.

anfis_config: configs/anfis/walker.yaml

anfis:
  normalize_firing: false

reference:
  dataset_transitions: 100000
  z_inference_steps: 10000
  seed: 42
  discount: 0.98

warmstart:
  enabled: true
  steps: 500
  lr: 0.01
  weight_decay: 0.0

reinforce:
  iters: 50
  pop_size: 16
  antithetic: true
  sigma: 0.5
  lr: 0.01
  weight_decay: 0.0
  grad_clip: 1.0
  train_episodes_per_z: 1
  train_seed_offset: 10000
  seed: 0

eval:
  tasks: null
  eval_every: 10
  eval_episodes: 10
  eval_seed_start: 0
