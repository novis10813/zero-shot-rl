# Cross-environment evaluation of the 10 finetune seeds (1000..1009) of the omega = 0.1 residual
# critics after 10 training episodes. One job per ordered pair loops over the 10 seeds; each
# seed evaluates 4 tasks on 20 test environments seeded 5..24 and the frozen FB actor at the
# same z.
on: idlab
vram: 4G
command: OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 tasks/T4.1.3.1-residual-soft-q/run_cross_eval_seeds.sh {pair}
grid:
  pair:
    - "clean mild"
    - "clean strong"
    - "mild clean"
    - "mild strong"
    - "strong clean"
    - "strong mild"
