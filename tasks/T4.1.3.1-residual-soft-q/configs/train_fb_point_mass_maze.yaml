# Vanilla FB on point_mass_maze rnd-100k, seeds 0-4, 1M steps, evaluated every 20k steps.
on: idlab
command: PYTHONUNBUFFERED=1 uv run python -m zero_shot_rl.train.main_exorl fb point_mass_maze rnd --eval_tasks reach_bottom_left reach_bottom_right reach_top_left reach_top_right --wandb_logging False --dataset_path $HOME/zsrl-datasets/point_mass_maze/rnd/dataset.npz --seed {seed}
vram: 10G
gpus: 1
grid:
  seed: [0, 1, 2, 3, 4]
