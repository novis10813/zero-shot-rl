# omega sweep of residual soft Q-learning in Actuator Strong of T3.2: omega 0.01, 0.03, 0.1 at alpha 0.1,
# unbounded candidates, one job per task. Selected FB checkpoint (FB seed 1, step 660000), Q 64x2,
# 10 training episodes with an update from the first step (warmup 0), tested after 0, 1, ..., 10
# episodes on 20 test environments seeded 5..24.
on: idlab
vram: 4G
command: OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 tasks/T4.1.3.1-residual-soft-q/run.sh omega.strong_{task}_w{omega} --tasks {task} --variants residual --omega {omega} --alpha 0.1 --hidden 64 --episodes 10 --eval_every 1 --warmup 0 --eval_episodes 20 --eval_seed_start 5 --dynamics tasks/T3.2-ood-robustness/configs/actuator_strong.yaml
grid:
  omega: [0.01, 0.03, 0.1]
  task: [stand, walk, run, flip]
