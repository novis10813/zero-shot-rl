# 10 finetune seeds (1000..1009) of residual soft Q-learning in Clean Walker at omega = 0.1,
# alpha = 0.1, Q 64x2, 10 training episodes (warmup 0), tested at episodes 0, 1, 3, 5, 10 on
# 20 evaluation environments seeded 5..24.
on: idlab
vram: 6G
command: OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 tasks/T4.1.3.1-residual-soft-q/run.sh ft.clean_{task}_s{seed} --tasks {task} --variants residual --omega 0.1 --alpha 0.1 --hidden 64 --episodes 10 --eval_at 0 1 3 5 10 --warmup 0 --eval_episodes 20 --eval_seed_start 5 --train_seed {seed} --seed {seed}
grid:
  task: [stand, walk, run, flip]
  seed: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]
