# Cross-environment evaluation of the omega = 0.1 residual soft Q-learning critics (after 10
# training episodes). Each job evaluates all 4 tasks (stand, walk, run, flip) on 20 test
# environments seeded 5..24.
on: idlab
vram: 4G
command: OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 tasks/T4.1.3.1-residual-soft-q/run_cross_eval.sh {pair}
grid:
  pair:
    - "clean mild"
    - "clean strong"
    - "mild clean"
    - "mild strong"
    - "strong clean"
    - "strong mild"
